version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: hall-o-flow-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: hall-o-flow
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hall-o-flow-api
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/hall-o-flow
      - NODE_ENV=development
      - JWT_SECRET=dev_secret_key_change_in_production
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hall-o-flow-web
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://localhost:5000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    command: npm run dev

volumes:
  mongodb_data:

networks:
  default:
    name: hall-o-flow-network
